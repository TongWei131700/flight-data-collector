<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="color-scheme" content="dark">
  <title>高舱 DEMO — Jesko 开屏 + CX857 商务舱</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>">

  <style>
    :root {
      --demo-bg: #BAC1D8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-size: 10px;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      /* 与 body 一致，避免第二部分等区块下拉/过滚动时露出默认白底 */
      background: #0a0a0f;
    }
    body {
      background: #0a0a0f;
      color: #f0f1f5;
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.4;
    }
    html.is-shell-root, html.is-shell-root body {
      height: 100vh;
      overflow: hidden;
    }
    html.is-shell-root {
      background: var(--demo-bg);
    }
    body.is-shell {
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--demo-bg);
    }
    .phone-shell {
      width: 750px;
      height: 1624px;
      border-radius: 50px;
      border: 8px solid #1a1a1a;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 0 0 2px rgba(0,0,0,0.06);
      overflow: hidden;
      transform-origin: center center;
      flex-shrink: 0;
    }
    .phone-shell iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #section-jesko {
      position: relative;
      z-index: 2;
    }
    /* Jesko 与 B777 叠层且 viewport 透明时，两层各有一个「下滑探索」会重影；组合稿只保留 B777 .scroll-cue（箭头 heroBounce 动效不变） */
    #section-jesko .hero-scroll-hint {
      display: none !important;
    }
    #section-b777 {
      max-width: 750px;
      margin: 0 auto;
      margin-top: -100vh;
      padding-bottom: calc(192px + env(safe-area-inset-bottom, 0px));
      position: relative;
      z-index: 1;
      /* 注入子页会剥掉其 body 背景，此处兜底与商务舱稿 --bg 对齐 */
      background: #06070b;
      --b777-reveal: 0;
      --b777-section-visibility: 0;
      opacity: var(--b777-section-visibility);
      pointer-events: none;
      will-change: opacity;
    }
    #section-b777.transition-visible { pointer-events: auto; }
    #section-b777 .s-hero .hero-content {
      will-change: transform, opacity, filter;
    }
    #section-b777 .s-hero .hero-content.is-bridge {
      position: fixed;
      left: 50%;
      bottom: calc(112px + env(safe-area-inset-bottom, 0px));
      width: min(654px, calc(100vw - 120px), calc(750px - 120px));
      max-width: calc(100vw - 120px);
      margin: 0;
      padding-bottom: 0;
      z-index: 4;
      pointer-events: none;
      opacity: var(--copy-bridge, 0);
      transform: translate3d(-50%, calc((1 - var(--copy-bridge, 0)) * 40px), 0) scale(calc(0.9 + var(--copy-bridge, 0) * 0.1));
      filter: blur(calc((1 - var(--copy-bridge, 0)) * 8px));
    }
    #section-b777 .s-hero .hero-content.is-bridge .rv,
    #section-b777 .s-hero .hero-content.bridge-handoff .rv {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
    #section-b777.bridge-copy-active .hero-top-group,
    #section-b777.bridge-copy-active .progress,
    #section-b777.bridge-copy-active .nav-dots,
    #section-b777.bridge-copy-active .sticky-book-bar,
    #section-b777.bridge-copy-active .sec:not(.s-hero),
    #section-b777.bridge-copy-active .s-hero .sec-bg,
    #section-b777.bridge-copy-active .s-hero .scroll-cue {
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }
    #section-b777.bridge-copy-active .s-hero .hero-content {
      opacity: 1;
      transition: opacity 0.22s ease;
    }
    html.jesko-complete #section-jesko .hero-viewport::after {
      opacity: 0 !important;
    }
    #section-b777 .hero-top-group,
    #section-b777 .progress,
    #section-b777 .nav-dots,
    #section-b777 .sticky-book-bar {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #section-b777.transition-visible .hero-top-group,
    #section-b777.transition-visible .progress,
    #section-b777.transition-visible .nav-dots {
      opacity: 1;
      pointer-events: auto;
    }
    /* Use ONE back arrow: keep the wrapper `.demo-back`, hide b777 internal back button
       but preserve layout spacing (so title stays centered). */
    #section-b777 .hero-back {
      visibility: hidden;
      pointer-events: none;
    }
    .demo-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.2rem;
      transition: opacity 0.5s ease;
    }
    .demo-loader.fade { opacity: 0; pointer-events: none; }
    .demo-loader span {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: rgba(240,241,245,0.5);
    }

    /* ========== Back button (reuse b777 hero-back style) ========== */
    .demo-back {
      position: fixed;
      /* align with b777 header: 88px simulated statusbar + nav row padding */
      top: calc(88px + env(safe-area-inset-top, 0px));
      left: clamp(20px, 4.8vw, 36px);
      z-index: 10000;
      width: 60px;
      height: 60px;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      opacity: 0.92;
    }
    .demo-back:active { opacity: 0.65; }
    .demo-back svg { width: 20px; height: 36px; display: block; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
</head>
<body>

  <div class="demo-loader" id="demoLoader"><span>Loading...</span></div>
  <button type="button" class="demo-back" id="demoBack" aria-label="返回">
    <svg width="20" height="36" viewBox="0 0 20 36" fill="none" aria-hidden="true"><path d="M18 2L2 18l16 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="section-jesko"></div>
  <div id="section-b777"></div>

  <script>
  (function () {
    "use strict";

    if (window === window.top && location.search.indexOf("embed=1") === -1) {
      document.documentElement.className = "is-shell-root";
      document.body.className = "is-shell";
      document.body.innerHTML = '<div class="phone-shell"><iframe src="'
        + location.pathname + '?embed=1"></iframe></div>';

      function fitShell() {
        var shell = document.querySelector(".phone-shell");
        if (!shell) return;
        var vw = window.innerWidth, vh = window.innerHeight;
        var sw = 766, sh = 1640, pad = 40;
        var scale = Math.min((vw - pad) / sw, (vh - pad) / sh, 1);
        shell.style.transform = scale < 1 ? "scale(" + scale + ")" : "none";
      }
      window.addEventListener("resize", fitShell);
      fitShell();
      return;
    }

    var SKIP_SRC = ["gsap", "ScrollTrigger", "figma.com"];

    var demoBack = document.getElementById("demoBack");
    if (demoBack) {
      demoBack.addEventListener("click", function () {
        if (window.history.length > 1) window.history.back();
        else window.location.href = "Qwen-对话流.html";
      });
    }

    function shouldSkipScript(el) {
      if (!el.src) return false;
      for (var i = 0; i < SKIP_SRC.length; i++) {
        if (el.src.indexOf(SKIP_SRC[i]) !== -1) return true;
      }
      return false;
    }

    function stripBodyHtmlRules(css) {
      return css
        .replace(/(?:^|\})\s*html\s*\{[^}]*\}/g, "")
        .replace(/(?:^|\})\s*body\s*\{[^}]*\}/g, "");
    }

    function activateScripts(container) {
      var scripts = Array.from(container.querySelectorAll("script"));
      var chain = Promise.resolve();

      scripts.forEach(function (old) {
        if (shouldSkipScript(old)) { old.remove(); return; }

        chain = chain.then(function () {
          return new Promise(function (resolve) {
            var ns = document.createElement("script");
            if (old.src) {
              ns.src = old.src;
              if (old.async) ns.async = true;
              ns.onload = ns.onerror = resolve;
            } else {
              ns.textContent = old.textContent;
            }
            old.parentNode.replaceChild(ns, old);
            if (!old.src) resolve();
          });
        });
      });

      return chain;
    }

    function injectPreloads(doc) {
      doc.querySelectorAll('link[rel="preload"]').forEach(function (link) {
        var cl = link.cloneNode(true);
        document.head.appendChild(cl);
      });
    }

    async function loadSection(url, containerId) {
      var resp = await fetch(url);
      var text = await resp.text();
      var parser = new DOMParser();
      var doc = parser.parseFromString(text, "text/html");
      var container = document.getElementById(containerId);

      injectPreloads(doc);

      doc.querySelectorAll("style").forEach(function (styleEl) {
        var s = document.createElement("style");
        s.textContent = stripBodyHtmlRules(styleEl.textContent);
        container.appendChild(s);
      });

      var tmp = document.createElement("div");
      tmp.innerHTML = doc.body.innerHTML;
      while (tmp.firstChild) {
        container.appendChild(tmp.firstChild);
      }

      await activateScripts(container);
    }

    (async function () {
      window.__JESKO_EMBEDDED_DEMO__ = true;
      await loadSection("子效果-jesko-window-demo.html", "section-jesko");
      await loadSection("子效果-business-upgrade-editorial-b777.html", "section-b777");

      function releaseScrollLock() {
        // Failsafe: child sections may lock body scrolling during preload.
        document.documentElement.style.removeProperty("overflow");
        document.body.style.removeProperty("overflow");
        document.body.style.removeProperty("overflow-y");
        document.body.style.removeProperty("position");
        document.body.style.removeProperty("touch-action");
      }
      var releaseScrollLockTimer = setTimeout(releaseScrollLock, 2600);
      releaseScrollLock();

      var jeskoViewport = document.querySelector("#section-jesko .hero-viewport");
      if (jeskoViewport) {
        jeskoViewport.style.setProperty("--bg", "#05060d");
        jeskoViewport.style.background = "transparent";
      }

      var b777 = document.getElementById("section-b777");
      var jeskoArea = document.querySelector("#section-jesko .hero-scroll-area");
      var b777Hero = document.querySelector("#section-b777 .s-hero");
      var b777HeroContent = document.querySelector("#section-b777 .s-hero .hero-content");
      var b777HeroRevealItems = b777HeroContent ? Array.from(b777HeroContent.querySelectorAll(".rv")) : [];
      var docEl = document.documentElement;
      // Keep wrapper scroll behavior aligned with standalone b777 page.
      var useNativeScroll = true;
      var revealStart = 0.64;
      var revealSpan = 0.24;
      var copyBridgeStart = 0.48;
      var copyBridgeSpan = 0.18;
      var transitionEndY = 0;
      var landingResistanceDistance = 0;
      var anchorSettleDistance = 0;
      var reverseUnlockDistance = 0;
      var lastKnownScrollY = 0;
      var anchorHoldUntil = 0;
      var wheelGestureLock = false;
      var wheelUnlockTimer = 0;
      var copyHandoffTimer = 0;
      var copyHandoffActive = false;
      var copyHandoffDone = false;
      var b777Entered = false;
      var b777Visible = false;
      var b777Anchored = false;
      var reverseUnlockArmed = false;
      var reverseIntent = 0;
      var reverseIntentLastTs = 0;
      var reverseReleaseUntil = 0;
      var touchState = { tracking: false, lastY: 0, blockCurrentGesture: false };

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function getScrollY() {
        return window.pageYOffset || docEl.scrollTop || 0;
      }

      function getTransitionMetrics() {
        if (!jeskoArea) return null;
        var scrollY = getScrollY();
        var rect = jeskoArea.getBoundingClientRect();
        var range = Math.max(rect.height - window.innerHeight, 1);
        return {
          rect: rect,
          range: range,
          progress: clamp(-rect.top / range, 0, 1),
          scrollY: scrollY,
          endY: scrollY + rect.top + range
        };
      }

      function clearCopyHandoffTimer() {
        if (!copyHandoffTimer) return;
        clearTimeout(copyHandoffTimer);
        copyHandoffTimer = 0;
      }

      function clearHeroContentInlineStyles() {
        if (!b777HeroContent) return;
        b777HeroContent.style.removeProperty("--copy-bridge");
        b777HeroContent.style.removeProperty("transform");
        b777HeroContent.style.removeProperty("transition");
        b777HeroContent.style.removeProperty("transform-origin");
        b777HeroContent.style.removeProperty("opacity");
        b777HeroContent.style.removeProperty("filter");
      }

      function resetCopyBridgeState() {
        clearCopyHandoffTimer();
        copyHandoffActive = false;
        copyHandoffDone = false;
        if (!b777HeroContent) return;
        b777HeroContent.classList.remove("is-bridge", "bridge-handoff");
        clearHeroContentInlineStyles();
      }

      function prepareHeroContentForBridge() {
        if (!b777HeroContent) return;
        b777HeroRevealItems.forEach(function (el) {
          el.classList.add("vis");
        });
      }

      function setHeroContentBridgeProgress(progressValue) {
        if (!b777HeroContent || copyHandoffActive || copyHandoffDone) return;
        prepareHeroContentForBridge();
        b777HeroContent.classList.add("is-bridge");
        b777HeroContent.classList.remove("bridge-handoff");
        b777HeroContent.style.setProperty("--copy-bridge", progressValue.toFixed(4));
      }

      function startCopyHandoff() {
        if (!b777HeroContent || copyHandoffActive || copyHandoffDone || !b777HeroContent.classList.contains("is-bridge")) return;

        clearCopyHandoffTimer();
        prepareHeroContentForBridge();
        copyHandoffActive = true;
        b777.classList.remove("bridge-copy-active");

        var first = b777HeroContent.getBoundingClientRect();
        b777HeroContent.classList.remove("is-bridge");
        b777HeroContent.style.removeProperty("--copy-bridge");
        var last = b777HeroContent.getBoundingClientRect();

        var dx = first.left - last.left;
        var dy = first.top - last.top;
        var sx = last.width ? first.width / last.width : 1;
        var sy = last.height ? first.height / last.height : 1;

        b777HeroContent.classList.add("bridge-handoff");
        b777HeroContent.style.transformOrigin = "top left";
        b777HeroContent.style.transition = "none";
        b777HeroContent.style.transform = "translate(" + dx.toFixed(2) + "px, " + dy.toFixed(2) + "px) scale(" + sx.toFixed(4) + ", " + sy.toFixed(4) + ")";
        b777HeroContent.style.opacity = "1";
        b777HeroContent.style.filter = "blur(0px)";
        b777HeroContent.getBoundingClientRect();

        requestAnimationFrame(function () {
          if (!b777HeroContent) return;
          b777HeroContent.style.transition = "transform 280ms cubic-bezier(0.22, 1, 0.36, 1), opacity 220ms linear, filter 220ms linear";
          b777HeroContent.style.transform = "translate(0px, 0px) scale(1, 1)";
        });

        copyHandoffTimer = setTimeout(function () {
          if (!b777HeroContent) return;
          b777HeroContent.classList.remove("bridge-handoff");
          clearHeroContentInlineStyles();
          copyHandoffActive = false;
          copyHandoffDone = true;
          copyHandoffTimer = 0;
        }, 320);
      }

      function syncReverseIntent(now, isUpward) {
        if (!isUpward) {
          reverseIntent = 0;
          reverseIntentLastTs = now;
          return 0;
        }
        if (!reverseIntentLastTs || now - reverseIntentLastTs > 220) {
          reverseIntent = 0;
        }
        reverseIntentLastTs = now;
        return reverseIntent;
      }

      function settleAtB777Anchor(forceBehavior) {
        if (useNativeScroll) return;
        if (!transitionEndY) return;
        b777Anchored = true;
        reverseUnlockArmed = true;
        reverseIntent = 0;
        reverseIntentLastTs = 0;
        anchorHoldUntil = Date.now() + 520;
        wheelGestureLock = true;
        if (wheelUnlockTimer) {
          clearTimeout(wheelUnlockTimer);
          wheelUnlockTimer = 0;
        }
        touchState.blockCurrentGesture = touchState.tracking;
        window.scrollTo({
          top: transitionEndY,
          behavior: forceBehavior || "auto"
        });
      }

      function getLandingResistanceFactor(scrollY) {
        if (!transitionEndY || !landingResistanceDistance) return 1;
        if (scrollY < transitionEndY) return 1;
        if (scrollY >= transitionEndY + landingResistanceDistance) return 1;
        var zoneProgress = clamp((scrollY - transitionEndY) / landingResistanceDistance, 0, 1);
        return 0.22 + Math.pow(zoneProgress, 1.35) * 0.78;
      }

      function shouldGateReverse(scrollY) {
        if (!transitionEndY || !reverseUnlockArmed) return false;
        return scrollY >= transitionEndY - 2 && scrollY <= transitionEndY + anchorSettleDistance;
      }

      function scheduleWheelGestureUnlock() {
        if (wheelUnlockTimer) clearTimeout(wheelUnlockTimer);
        wheelUnlockTimer = setTimeout(function () {
          wheelGestureLock = false;
          wheelUnlockTimer = 0;
        }, 160);
      }

      function applyDirectionalScrollControl(deltaY, source) {
        if (useNativeScroll) return false;
        if (!deltaY) return false;
        var now = performance.now();
        var scrollY = getScrollY();
        var targetY = scrollY + deltaY;

        if (deltaY > 0) {
          syncReverseIntent(now, false);
          if (scrollY < transitionEndY && targetY >= transitionEndY - 2) {
            settleAtB777Anchor("auto");
            return true;
          }
          if (source === "touch" && touchState.blockCurrentGesture && b777Anchored && scrollY <= transitionEndY + anchorSettleDistance) {
            window.scrollTo(0, transitionEndY);
            return true;
          }
          if (source === "wheel" && wheelGestureLock && b777Anchored && scrollY <= transitionEndY + anchorSettleDistance) {
            scheduleWheelGestureUnlock();
            window.scrollTo(0, transitionEndY);
            return true;
          }
          if (b777Anchored && Date.now() < anchorHoldUntil && scrollY <= transitionEndY + anchorSettleDistance) {
            window.scrollTo(0, transitionEndY);
            return true;
          }
          var factor = getLandingResistanceFactor(scrollY);
          if (factor < 0.999) {
            window.scrollTo(0, scrollY + deltaY * factor);
            return true;
          }
          return false;
        }

        if (Date.now() < reverseReleaseUntil) {
          syncReverseIntent(now, true);
          return false;
        }

        if (!shouldGateReverse(scrollY)) {
          syncReverseIntent(now, false);
          return false;
        }

        reverseIntent = syncReverseIntent(now, true) + Math.abs(deltaY);
        if (reverseIntent < reverseUnlockDistance) {
          window.scrollTo(0, Math.max(transitionEndY, scrollY + deltaY * 0.08));
          return true;
        }

        reverseUnlockArmed = false;
        reverseReleaseUntil = Date.now() + 900;
        reverseIntent = 0;
        reverseIntentLastTs = 0;
        b777Anchored = false;
        window.scrollTo(0, Math.max(0, transitionEndY - Math.min(window.innerHeight * 0.18, 120)));
        return true;
      }

      function syncContinuousTransition() {
        if (!jeskoArea || !b777) return;
        var metrics = getTransitionMetrics();
        if (!metrics) return;
        var progress = metrics.progress;
        var reveal = clamp((progress - revealStart) / revealSpan, 0, 1);
        var copyBridge = clamp((progress - copyBridgeStart) / copyBridgeSpan, 0, 1);
        var heroTopReached = b777Hero && b777Hero.getBoundingClientRect().top <= window.innerHeight * 0.08;
        transitionEndY = metrics.endY;
        landingResistanceDistance = Math.max(window.innerHeight * 0.92, 360);
        anchorSettleDistance = Math.max(window.innerHeight * 0.72, 300);
        reverseUnlockDistance = Math.max(window.innerHeight * 0.58, 320);
        var sectionReveal = reveal;
        b777Visible = b777Visible
          ? (reveal > 0.005 || metrics.scrollY > transitionEndY)
          : reveal > 0.018;
        b777Entered = b777Entered
          ? (reveal > 0.74 || metrics.scrollY > transitionEndY + window.innerHeight * 0.04)
          : (reveal > 0.88 || heroTopReached);

        if (!b777Anchored && lastKnownScrollY < transitionEndY - 2 && metrics.scrollY >= transitionEndY - 2) {
          settleAtB777Anchor("auto");
        }

        if (metrics.scrollY > transitionEndY + anchorSettleDistance) {
          b777Anchored = true;
          reverseUnlockArmed = false;
          reverseIntent = 0;
          reverseIntentLastTs = 0;
          anchorHoldUntil = 0;
          wheelGestureLock = false;
        } else if (metrics.scrollY >= transitionEndY - 2 && Date.now() >= reverseReleaseUntil) {
          reverseUnlockArmed = true;
        }

        if (metrics.scrollY < transitionEndY - Math.max(window.innerHeight * 0.1, 64)) {
          b777Anchored = false;
          reverseUnlockArmed = false;
          reverseIntent = 0;
          reverseIntentLastTs = 0;
          reverseReleaseUntil = 0;
          anchorHoldUntil = 0;
          wheelGestureLock = false;
          if (wheelUnlockTimer) {
            clearTimeout(wheelUnlockTimer);
            wheelUnlockTimer = 0;
          }
          touchState.blockCurrentGesture = false;
          b777.classList.remove("bridge-copy-active");
          resetCopyBridgeState();
        }

        if (copyBridge > 0.02 && !copyHandoffDone && !copyHandoffActive) {
          b777.classList.add("bridge-copy-active");
          sectionReveal = Math.max(reveal, copyBridge);
          setHeroContentBridgeProgress(copyBridge);
        } else if (!copyHandoffActive) {
          b777.classList.remove("bridge-copy-active");
        }

        if (!copyHandoffDone && !copyHandoffActive && metrics.scrollY >= transitionEndY - 2 && copyBridge > 0.98) {
          startCopyHandoff();
        }

        lastKnownScrollY = metrics.scrollY;

        docEl.classList.toggle("jesko-complete", progress > 0.985);
        b777.style.setProperty("--b777-reveal", reveal.toFixed(4));
        b777.style.setProperty("--b777-section-visibility", sectionReveal.toFixed(4));
        b777.classList.toggle("transition-visible", b777Visible);
        b777.classList.toggle("entered", b777Entered);
      }

      var ticking = false;
      function queueSync() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          syncContinuousTransition();
          ticking = false;
        });
      }

      window.addEventListener("scroll", queueSync, { passive: true });
      window.addEventListener("resize", queueSync);
      window.addEventListener("wheel", function (event) {
        if (useNativeScroll) return;
        if (event.ctrlKey) return;
        if (applyDirectionalScrollControl(event.deltaY, "wheel")) {
          event.preventDefault();
          queueSync();
        }
      }, { passive: false });
      window.addEventListener("touchstart", function (event) {
        if (!event.touches || event.touches.length !== 1) {
          touchState.tracking = false;
          return;
        }
        touchState.tracking = true;
        touchState.lastY = event.touches[0].clientY;
      }, { passive: true });
      window.addEventListener("touchmove", function (event) {
        if (useNativeScroll) return;
        if (!touchState.tracking || !event.touches || event.touches.length !== 1) return;
        var currentY = event.touches[0].clientY;
        var deltaY = touchState.lastY - currentY;
        touchState.lastY = currentY;
        if (applyDirectionalScrollControl(deltaY, "touch")) {
          event.preventDefault();
          queueSync();
        }
      }, { passive: false });
      window.addEventListener("touchend", function () {
        touchState.tracking = false;
        touchState.blockCurrentGesture = false;
      }, { passive: true });
      window.addEventListener("touchcancel", function () {
        touchState.tracking = false;
        touchState.blockCurrentGesture = false;
      }, { passive: true });
      syncContinuousTransition();
      releaseScrollLock();

      var loader = document.getElementById("demoLoader");
      loader.classList.add("fade");
      setTimeout(function () {
        loader.remove();
        clearTimeout(releaseScrollLockTimer);
        releaseScrollLock();
      }, 600);
    })();
  })();
  </script>
</body>
</html>
